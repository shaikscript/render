services:
  - type: web
    name: ai-square-hub
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: ai-square-db, property: connectionString}
      - key: SETUP_KEY
        generateValue: true
      - key: APP_TZ
        value: Asia/Kolkata
databases:
  - name: ai-square-db
    plan: free
